<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Will Lawyer — Voice Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: rgba(0,0,0,0.10);
      --border-strong: rgba(0,0,0,0.18); --text-primary: #1a1a18;
      --text-secondary: #5f5e5a; --text-muted: #888780;
      --accent: #1a1a18; --accent-fg: #ffffff; --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --surface: #2c2c2a; --border: rgba(255,255,255,0.10);
        --border-strong: rgba(255,255,255,0.18); --text-primary: #f1efe8;
        --text-secondary: #b4b2a9; --text-muted: #888780;
        --accent: #f1efe8; --accent-fg: #1a1a18;
      }
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary);
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
    .wrap { width: 100%; max-width: 620px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.75rem; }
    .logo { width: 42px; height: 42px; border-radius: 10px; background: var(--accent);
      display: flex; align-items: center; justify-content: center; }
    .logo i { color: var(--accent-fg); font-size: 20px; }
    h1 { font-size: 17px; font-weight: 500; color: var(--text-primary); }
    .sub { font-size: 13px; color: var(--text-muted); margin-top: 1px; }
    .card { background: var(--surface); border: 0.5px solid var(--border);
      border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; }
    textarea { width: 100%; min-height: 160px; font-size: 15px; line-height: 1.65;
      resize: vertical; border: 0.5px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text-primary); padding: 10px 12px; font-family: inherit; }
    textarea:focus { outline: none; border-color: var(--border-strong); }
    .char-count { font-size: 12px; color: var(--text-muted); text-align: right; margin-top: 5px; }
    .voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
    .voice-section { margin-bottom: 4px; }
    .voice-section-label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; display: block;
      text-transform: uppercase; letter-spacing: 0.05em; }
    .voice-btn { width: 100%; padding: 8px 10px; border: 0.5px solid var(--border-strong);
      border-radius: var(--radius); background: var(--surface); color: var(--text-secondary);
      font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.15s; text-align: left; }
    .voice-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .voice-btn:hover:not(.active) { background: var(--bg); }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--text-muted); }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .slider-val { font-size: 13px; color: var(--text-secondary); min-width: 36px; text-align: right; }
    .actions { display: flex; gap: 8px; margin-bottom: 0.75rem; }
    .btn { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius);
      font-size: 14px; font-family: inherit; cursor: pointer; border: 0.5px solid var(--border-strong);
      background: var(--surface); color: var(--text-primary); transition: all 0.15s; }
    .btn:hover { background: var(--bg); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn.primary:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.25s; border-radius: 2px; }
    .status { font-size: 12px; color: var(--text-muted); margin-top: 6px; min-height: 16px; }
    .download-row { display: none; align-items: center; gap: 8px; margin-top: 10px; }
    .download-row.visible { display: flex; }
    hr { border: none; border-top: 0.5px solid var(--border); margin: 1rem 0; }
    .footer-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .profile-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
    .profile-btn { padding: 10px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius);
      background: var(--surface); color: var(--text-secondary); font-family: inherit; cursor: pointer; text-align: left; }
    .profile-btn .p-name { font-size: 14px; font-weight: 500; display: block; }
    .profile-btn .p-handle { font-size: 12px; opacity: 0.7; }
    .profile-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .script-tools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    .saved-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 0.5px solid var(--border); }
    .saved-item:first-of-type { border-top: none; }
    .saved-title { flex: 1; font-size: 13px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .saved-title:hover { text-decoration: underline; }
    .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
    .icon-btn:hover { color: var(--text-primary); }
    .empty { font-size: 12px; color: var(--text-muted); }
    audio { width: 100%; height: 36px; border-radius: var(--radius); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo"><i class="ti ti-microphone"></i></div>
    <div>
      <h1>Free Will Lawyer — Voice Reader</h1>
      <p class="sub">Instagram script reader</p>
    </div>
  </div>

  <div class="profile-tabs" id="profile-tabs"></div>

  <div class="card">
    <span class="card-label">Voice</span>
    <div id="voice-list" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <div class="card">
    <span class="card-label">Script</span>
    <textarea id="script-input" placeholder="Paste or type your script here..." oninput="updateCount()"></textarea>
    <p class="char-count" id="char-count">0 characters</p>
    <div class="script-tools">
      <button class="btn small" onclick="document.getElementById('file-input').click()">
        <i class="ti ti-file-import"></i> <span id="import-label">Import .txt / .docx</span>
      </button>
      <button class="btn small" onclick="saveScript()">
        <i class="ti ti-device-floppy"></i> <span id="save-label">Save script</span>
      </button>
      <input type="file" id="file-input" accept=".txt,.docx" hidden onchange="importFile(this)">
    </div>
  </div>

  <div class="card">
    <span class="card-label" id="saved-label">Saved scripts</span>
    <div id="saved-list"></div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label>Speed</label>
        <div class="slider-row">
          <input type="range" id="speed" min="0.6" max="1.6" step="0.1" value="1.0"
            oninput="document.getElementById('speed-val').textContent=parseFloat(this.value).toFixed(1)+'×'">
          <span class="slider-val" id="speed-val">1.0×</span>
        </div>
      </div>
      <div class="field">
        <label id="lbl-expr">Expressiveness <a href="#" onclick="resetNoise();return false" style="color:var(--text-muted)">(auto)</a></label>
        <div class="slider-row">
          <input type="range" id="noise" min="0" max="1.2" step="0.05" value="0.667"
            oninput="noiseTouched.noise=true;document.getElementById('noise-val').textContent=parseFloat(this.value).toFixed(2)">
          <span class="slider-val" id="noise-val">auto</span>
        </div>
      </div>
      <div class="field">
        <label id="lbl-rhythm">Rhythm variation</label>
        <div class="slider-row">
          <input type="range" id="noisew" min="0" max="1.2" step="0.05" value="0.8"
            oninput="noiseTouched.noisew=true;document.getElementById('noisew-val').textContent=parseFloat(this.value).toFixed(2)">
          <span class="slider-val" id="noisew-val">auto</span>
        </div>
      </div>
      <div class="field">
        <label>Volume</label>
        <div class="slider-row">
          <input type="range" id="vol" min="0.1" max="1.0" step="0.1" value="1.0"
            oninput="document.getElementById('vol-val').textContent=Math.round(this.value*100)+'%'">
          <span class="slider-val" id="vol-val">100%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="play-btn" onclick="speak()">
      <i class="ti ti-player-play"></i> <span id="play-label">Play script</span>
    </button>
    <button class="btn" id="stop-btn" onclick="stopAudio()" disabled>
      <i class="ti ti-square"></i> Stop
    </button>
  </div>

  <div class="progress"><div class="progress-bar" id="prog"></div></div>
  <p class="status" id="status"></p>

  <div class="download-row" id="dl-row">
    <i class="ti ti-volume" style="font-size:16px;color:var(--text-muted)"></i>
    <audio id="audio-player" controls></audio>
    <a id="dl-link" class="btn" download="script.wav">
      <i class="ti ti-download"></i> Download
    </a>
  </div>

  <hr>
  <div class="footer-note">
    <i class="ti ti-info-circle" style="font-size:15px"></i>
    Audio generated locally with Piper TTS — no internet required after setup.
  </div>
</div>

<script>
  const noiseTouched = { noise: false, noisew: false };
  function resetNoise() {
    noiseTouched.noise = noiseTouched.noisew = false;
    document.getElementById('noise').value = 0.667; document.getElementById('noise-val').textContent = 'auto';
    document.getElementById('noisew').value = 0.8; document.getElementById('noisew-val').textContent = 'auto';
  }

  let profiles = {};
  let currentProfile = 'en';
  let currentVoice = 'en_lessac';
  let currentAudio = null;
  let progTimer = null;
  let progVal = 0;

  const VOICE_LABELS = {
    en_lessac: 'Lessac (Male)', en_amy: 'Amy (Female)',
    es_sharvard: 'Sharvard (ES)', es_mx: 'Ald (MX)',
    en_ryan: 'Ryan (Male · warm)', en_cori: 'Cori (UK Female · calm)', en_ljspeech: 'LJ (Female · neutral)', en_joe: 'Joe (Male · deep, announcer)',
    es_daniela: 'Daniela (AR Mujer · cálida)', es_claude: 'Claude (MX Hombre)', es_davefx: 'Dave (ES Hombre · neutral)',
  };
  const T = {
    en: { placeholder: 'Paste or type your script here...', play: 'Play script', imp: 'Import .txt / .docx',
          save: 'Save script', expr: 'Expressiveness', rhythm: 'Rhythm variation', saved: 'Saved scripts', none: 'No saved scripts yet.', titlePrompt: 'Script title:' },
    es: { placeholder: 'Pega o escribe tu script aquí...', play: 'Reproducir script', imp: 'Importar .txt / .docx',
          save: 'Guardar script', expr: 'Expresividad', rhythm: 'Variación de ritmo', saved: 'Scripts guardados', none: 'Aún no hay scripts guardados.', titlePrompt: 'Título del script:' },
  };
  const t = () => T[profiles[currentProfile]?.lang || 'en'];

  async function init() {
    profiles = await (await fetch('/profiles')).json();
    const saved = localStorage.getItem('fwl_profile');
    selectProfile(profiles[saved] ? saved : 'en');
  }

  function selectProfile(id) {
    currentProfile = id;
    localStorage.setItem('fwl_profile', id);
    const p = profiles[id];
    document.getElementById('profile-tabs').innerHTML = Object.entries(profiles).map(([pid, pr]) =>
      `<button class="profile-btn ${pid === id ? 'active' : ''}" onclick="selectProfile('${pid}')">
         <span class="p-name">${pr.name}</span><span class="p-handle">@${pr.handle}</span></button>`).join('');
    document.getElementById('voice-list').innerHTML = p.voices.map(v =>
      `<button class="voice-btn" data-voice="${v}" onclick="setVoice('${v}')">${VOICE_LABELS[v] || v}</button>`).join('');
    setVoice(p.default_voice);
    document.getElementById('script-input').placeholder = t().placeholder;
    document.getElementById('play-label').textContent = t().play;
    document.getElementById('import-label').textContent = t().imp;
    document.getElementById('save-label').textContent = t().save;
    document.getElementById('saved-label').textContent = t().saved;
    document.getElementById('lbl-expr').firstChild.textContent = t().expr + ' ';
    document.getElementById('lbl-rhythm').textContent = t().rhythm;
    loadSaved();
  }

  function setVoice(v) {
    currentVoice = v;
    document.querySelectorAll('.voice-btn').forEach(b => b.classList.toggle('active', b.dataset.voice === v));
  }

  async function loadSaved() {
    const box = document.getElementById('saved-list');
    const res = await fetch('/scripts/' + currentProfile);
    const items = res.ok ? await res.json() : [];
    window._saved = items;
    box.innerHTML = items.length ? items.map(i =>
      `<div class="saved-item">
         <span class="saved-title" onclick="openSaved('${i.id}')">${escapeHtml(i.title)}</span>
         <button class="icon-btn" title="Delete" onclick="deleteSaved('${i.id}')"><i class="ti ti-trash"></i></button>
       </div>`).join('') : `<p class="empty">${t().none}</p>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function openSaved(id) {
    const item = window._saved.find(i => i.id === id);
    if (!item) return;
    document.getElementById('script-input').value = item.text;
    updateCount();
  }

  async function saveScript() {
    const text = document.getElementById('script-input').value;
    if (!text.trim()) { setStatus(t().placeholder); return; }
    const title = prompt(t().titlePrompt, text.trim().split('\n')[0].slice(0, 50));
    if (title === null) return;
    const res = await fetch('/scripts/' + currentProfile, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, text })
    });
    if (!res.ok) { setStatus('Error: ' + (await res.json()).detail); return; }
    loadSaved();
  }

  async function deleteSaved(id) {
    await fetch(`/scripts/${currentProfile}/${id}`, { method: 'DELETE' });
    loadSaved();
  }

  async function importFile(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch('/import', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Import failed');
      document.getElementById('script-input').value = data.text;
      updateCount();
      setStatus('');
    } catch (e) {
      setStatus('Error: ' + e.message);
    }
  }

  function updateCount() {
    const n = document.getElementById('script-input').value.length;
    document.getElementById('char-count').textContent = n + ' character' + (n !== 1 ? 's' : '');
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg; }

  function startProgress() {
    progVal = 0;
    document.getElementById('prog').style.width = '0%';
    progTimer = setInterval(() => {
      progVal = Math.min(progVal + 1.2, 90);
      document.getElementById('prog').style.width = progVal + '%';
    }, 120);
  }

  function endProgress(success) {
    clearInterval(progTimer);
    document.getElementById('prog').style.width = success ? '100%' : '0%';
    setTimeout(() => { document.getElementById('prog').style.width = '0%'; }, 800);
  }

  async function speak() {
    const text = document.getElementById('script-input').value.trim();
    if (!text) { setStatus('No script to read.'); return; }

    stopAudio();
    document.getElementById('play-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    document.getElementById('dl-row').className = 'download-row';
    const isEs = currentVoice.startsWith('es');
    setStatus(isEs ? 'Generando audio...' : 'Generating audio...');
    startProgress();

    try {
      const res = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          voice: currentVoice,
          speed: parseFloat(document.getElementById('speed').value),
          noise_scale: noiseTouched.noise ? parseFloat(document.getElementById('noise').value) : null,
          noise_w_scale: noiseTouched.noisew ? parseFloat(document.getElementById('noisew').value) : null,
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Server error');
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      const player = document.getElementById('audio-player');
      player.src = url;
      player.volume = parseFloat(document.getElementById('vol').value);
      player.play();
      currentAudio = player;

      document.getElementById('dl-link').href = url;
      document.getElementById('dl-row').className = 'download-row visible';

      endProgress(true);
      setStatus(isEs ? 'Reproduciendo...' : 'Playing...');

      player.onended = () => {
        setStatus('');
        document.getElementById('play-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
      };

    } catch (e) {
      endProgress(false);
      setStatus('Error: ' + e.message);
      document.getElementById('play-btn').disabled = false;
      document.getElementById('stop-btn').disabled = true;
    }
  }

  function stopAudio() {
    const player = document.getElementById('audio-player');
    player.pause();
    player.currentTime = 0;
    document.getElementById('play-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;
    setStatus('');
  }

  init();
</script>
</body>
</html>
